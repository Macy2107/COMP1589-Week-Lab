<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
    <h1>Interactive Rectangle Area Calculator</h1>
    <p>Enter height</p>
    <!-- Text boxes to assign input for height and width -->
    <input type="text" id="height">
    <p>Enter width</p>
    <input type="text" id="width">
    <br></br>
    <!-- Return doCalculation after asigned the value -->
    <button onclick="doCalculation()">Calculate Area</button>
    <p id="message"></p>
     <script>
        function calcRectangleArea(width, height) {
            let area = width * height;
            return area;
        }

        function doCalculation() {
            let height = Number(document.getElementById("height").value);
            let width = Number(document.getElementById("width").value);
            let rectangleArea = calcRectangleArea(width, height);
            document.getElementById("message").innerHTML = "Area of this rectangle is " + rectangleArea;
        }
    </script>

  </body>
</html>
