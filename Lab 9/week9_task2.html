<body>
<canvas id="sCanvas" width="800" height="800"></canvas>
<script>
    // Art Balling Generator Using Loops
    // Variables
    let randomColour;
    let randomSize;
    let xPos;
    let yPos;
    let i; // counter
    let j; // counter
    let numCircles; // how many circles/splatters to draw
    // Get the Canvas element with ID that will be drawn
    const c = document.getElementById("sCanvas");
    const ctx = c.getContext("2d");

    function drawFilledCircle(size,xPos,yPos,colour){
        ctx.beginPath();
        ctx.arc(xPos,yPos,size,0,2*Math.PI);
        ctx.fillStyle = colour;
        ctx.fill();
    };

    function drawSplatter(size,xPos,yPos,colour){
        for(j = 0; j < 10; j++){
            let splatSize = size / Math.round(Math.random()*160);
            drawFilledCircle(splatSize,xPos + Math.round(Math.random()*1000),yPos + Math.round(Math.random()*1000),colour);
        }
    }

    // Random number of circles/splatters between 1 and 20
    numCircles = Math.round(Math.random()*150) + 1;

    for (i = 0; i < numCircles; i++) {
        randomSize = Math.round(Math.random()*60);
        xPos = Math.round(Math.random()*1050);
        yPos = Math.round(Math.random()*1050);
        randomColour = '#' + Math.random().toString(16).substring(2, 8);
        drawFilledCircle(randomSize, xPos, yPos, randomColour);
        drawSplatter(randomSize, xPos, yPos, randomColour);
    }
</script>
</body>
